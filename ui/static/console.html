<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodus Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<script src="/static/chrome.js"></script>
<script src="/static/chat-widget.js" defer></script>
<style>
/* ------------------------------------------------------------------ tokens
   Every name below is an ALIAS onto base.css, not a value.

   This page was built dark-only against its own violet palette, so a
   colour meant one thing here and something else two tabs away -- and
   the tool whose entire job is explaining a graph was speaking three
   dialects. Rather than rewrite eight hundred lines of selectors, the
   old names are kept and repointed at the shared tokens: the page reads
   the same, but it now themes with the others and draws from the one
   validated palette.

   The tier colours carry the argument and keep their meaning: red is
   filed against the node, amber is a traced path, yellow is build scope
   only, green is checked-and-clear. Green is a result, not an absence.
   They map onto the reserved STATUS ramp, which is outside the
   categorical set on every page for exactly this reason.

   `--soft-N` replaces the hardcoded var(--soft-1) washes. Those
   are invisible on a light surface, which is the single thing that
   would have made this page unusable in the shared theme. */
:root{
  --bg:var(--surface-1); --panel:var(--surface-0);
  --panel-2:var(--surface-0); --panel-3:var(--surface-2);
  --line-2:var(--line-soft);
  --line-3:var(--line-soft);
  --fg:var(--ink-1); --fg-2:var(--ink-2); --fg-3:var(--ink-2); --fg-4:var(--ink-2);
  --mut:var(--ink-3); --mut-2:var(--ink-3); --mut-3:var(--ink-3);
  --mut-4:var(--ink-3); --mut-5:var(--ink-3);

  --high:var(--critical); --mod:var(--serious); --warn:var(--warn);
  --safe:var(--ok); --violet:var(--accent); --violet-fg:var(--accent);

  --soft-1:color-mix(in srgb, var(--ink-1) 3%, transparent);
  --soft-2:color-mix(in srgb, var(--ink-1) 5%, transparent);
  --soft-3:color-mix(in srgb, var(--ink-1) 9%, transparent);
  --soft-4:color-mix(in srgb, var(--ink-1) 14%, transparent);
  --soft-5:color-mix(in srgb, var(--ink-1) 24%, transparent);
}
/* base.css ships generic .card/.empty/.step/.rule components. This page
   had all four names first and means something different by each, and it
   loads after, so it wins wherever both set a property -- but not where
   base.css sets one this page never does (a .card gains padding, an
   .empty becomes position:absolute). Those four are reset here rather
   than renamed across eight hundred lines. */
.card{padding:0;box-shadow:none}
.empty{position:static;inset:auto;display:block;place-items:normal}
.lane .step,.stage .step{width:auto;height:auto;border-radius:0;background:none;
  display:inline;place-items:normal;font-weight:400}
.lane .rule{border:0}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--fg);height:100vh;overflow:hidden;
  display:flex;flex-direction:column}
a{color:var(--violet-fg);text-decoration:none}
a:hover{color:var(--accent)}
button{font-family:var(--sans)}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-track{background:var(--soft-1)}
::-webkit-scrollbar-thumb{background:var(--soft-4);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--soft-5)}

@keyframes brFlow{to{stroke-dashoffset:-36}}
@keyframes brRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes brDraw{from{stroke-dashoffset:620}to{stroke-dashoffset:0}}
@keyframes brPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--serious) 32%, transparent)}55%{box-shadow:0 0 0 9px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ------------------------------------------------------------------ shell */
#shell{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1;min-height:0;
  background:var(--bg);overflow:hidden}

aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand-box{padding:18px 18px 16px;border-bottom:1px solid var(--line-2)}
.brand{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut-4);margin-top:4px}

aside > nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line-2)}
.nav-btn{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;border:0;border-radius:8px;
  padding:9px 11px;background:transparent;color:var(--mut);font-size:13.5px;font-weight:500;transition:background .14s}
.nav-btn:hover{background:var(--soft-2)}
.nav-btn.on{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--fg)}
.nav-btn .g{font-family:var(--mono);font-size:11px;color:var(--mut-5);width:13px}
.nav-btn.on .g{color:var(--violet)}
.nav-btn .lbl{flex:1}
.nav-btn .n{font-family:var(--mono);font-size:10.5px;color:var(--mut-5)}
.nav-btn.on .n{color:var(--violet-fg)}

.side-head{padding:14px 16px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut-4)}
#targets{flex:1;overflow-y:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:2px;min-height:0}
.tgt{text-align:left;cursor:pointer;border:1px solid var(--line-2);background:transparent;border-radius:8px;
  padding:9px 10px;transition:border-color .14s,background .14s}
.tgt:hover{border-color:var(--soft-5)}
.tgt.on{background:color-mix(in srgb, var(--accent) 14%, transparent);border-color:color-mix(in srgb, var(--accent) 50%, transparent)}
.tgt .row{display:flex;align-items:center;gap:8px}
.tgt .gl{font-family:var(--mono);font-size:10px;flex:0 0 auto}
.tgt .nm{font-family:var(--mono);font-size:11.5px;color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt .mt{font-family:var(--mono);font-size:10px;color:var(--mut-3);margin-top:5px}
.side-foot{border-top:1px solid var(--line-2);padding:12px 16px;font-family:var(--mono);
  font-size:10.5px;color:var(--mut-4);line-height:1.7}

/* ----------------------------------------------------------------- header */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
main > header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap;flex:0 0 auto}
.view-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.view-sub{font-family:var(--mono);font-size:10.5px;color:var(--mut-4);margin-top:3px}
.focus{display:flex;align-items:center;gap:9px;background:var(--panel-3);border:1px solid var(--soft-3);
  border-radius:8px;padding:8px 13px;min-width:300px}
.focus .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut-4)}
.focus .v{font-family:var(--mono);font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus .q{font-family:var(--mono);font-size:10.5px;color:var(--mut-4)}
.spacer{flex:1}
.tiers{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tiers .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut-4)}
.tier-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
  color:var(--mut);white-space:nowrap;cursor:default}
.tier-chip .g{font-size:10px}
.tier-chip .id{font-weight:700}
.act{cursor:pointer;border:1px solid color-mix(in srgb, var(--critical) 35%, transparent);background:color-mix(in srgb, var(--critical) 9%, transparent);color:var(--critical);
  border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:11.5px;white-space:nowrap;transition:background .14s}
.act:hover{background:color-mix(in srgb, var(--critical) 17%, transparent)}
.act[disabled]{opacity:.45;cursor:not-allowed}
.act.retract{border-color:color-mix(in srgb, var(--ok) 35%, transparent);background:color-mix(in srgb, var(--ok) 9%, transparent);color:var(--ok)}
.act.retract:hover{background:color-mix(in srgb, var(--ok) 17%, transparent)}

/* ------------------------------------------------------------------- body */
#body{flex:1;overflow:auto;min-height:0;padding:18px 22px 28px}

.story{display:flex;align-items:flex-start;gap:16px;border:1px solid var(--line);
  background:var(--soft-1);border-radius:12px;padding:15px 17px}
.story.p0{background:color-mix(in srgb, var(--critical) 6%, transparent);border-color:color-mix(in srgb, var(--critical) 30%, transparent)}
.story .badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.06em;background:var(--soft-2);border:1px solid var(--soft-4);
  border-radius:6px;padding:5px 9px;white-space:nowrap;flex:0 0 auto}
.story .badge .g{font-size:10px}
.story .sentence{font-size:14.5px;line-height:1.55;color:var(--fg);text-wrap:pretty}
.story .sub{font-family:var(--mono);font-size:11px;color:var(--mut-2);margin-top:7px}

/* The 1px separators are drawn by each tile's outer shadow bleeding into
   the gap, not by the container's background showing through it. Seven
   KPIs into a four-wide grid leaves a trailing cell, and with the
   line colour behind the grid that cell rendered as a solid grey block
   -- a tile with no content in it, which reads as a bug. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.kpi{background:var(--panel-2);padding:13px 15px;box-shadow:0 0 0 1px var(--line)}
.kpi .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut-4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{display:flex;align-items:baseline;gap:7px;margin-top:8px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .u{font-family:var(--mono);font-size:10.5px;color:var(--mut-3)}

.card{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.card-head{display:flex;align-items:center;gap:16px;padding:11px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-head .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.card-head .h{font-family:var(--mono);font-size:11px;color:var(--mut-3)}
.edge-key{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  color:var(--mut-2);white-space:nowrap}
.edge-key i{width:14px;height:2px;display:inline-block}

/* ------------------------------------------------------------------ graph */
.graph-scroll{overflow:auto;padding:16px}
.graph-plane{position:relative}
.graph-plane svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lane{position:absolute;top:0}
.lane .r{display:flex;align-items:baseline;gap:7px}
.lane .step{font-family:var(--mono);font-size:10px;color:var(--mut-5)}
.lane .title{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.lane .count{font-family:var(--mono);font-size:9.5px;color:var(--mut-4);margin-top:4px}
.lane .rule{height:2px;margin-top:8px}
.gnote{position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.08em;background:var(--panel);
  padding:2px 5px;border-radius:4px;white-space:nowrap}
.gnode{position:absolute;cursor:pointer;border:1px solid;border-radius:10px;padding:9px 11px;
  transition:transform .16s ease,border-color .16s ease}
.gnode:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.gnode .r1{display:flex;align-items:center;gap:8px}
.gnode .gl{font-family:var(--mono);font-size:10px;flex:0 0 auto}
.gnode .nm{font-family:var(--mono);font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode .r2{display:flex;align-items:center;gap:9px;margin-top:7px}
.gnode .mt{font-family:var(--mono);font-size:9.5px;color:var(--mut-2);flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gnode .tag{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;border-radius:4px;
  padding:2px 5px;white-space:nowrap;flex:0 0 auto}
.tip{position:absolute;width:296px;z-index:5;border:1px solid var(--soft-5);background:color-mix(in srgb, var(--surface-0) 97%, transparent);
  backdrop-filter:blur(8px);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow-2);
  pointer-events:none}
.tip .r{display:flex;align-items:center;gap:8px}
.tip .nm{font-family:var(--mono);font-size:12px;color:var(--fg)}
.tip .tr{font-family:var(--mono);font-size:10px;font-weight:700}
.tip .why{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin-top:9px;text-wrap:pretty}
.tip .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut-4);margin-top:11px}
.tip .edges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tip .e{font-family:var(--mono);font-size:9.5px;color:var(--ident-2);background:color-mix(in srgb, var(--serious) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--serious) 28%, transparent);border-radius:4px;padding:3px 6px}
.tip .mt{font-family:var(--mono);font-size:10px;color:var(--mut-3);margin-top:11px;word-break:break-all}

/* --------------------------------------------------------------- findings */
.split{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;align-items:flex-start}
.pane{flex:1 1 620px;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--soft-1);
  border-bottom:1px solid var(--line-2)}
.pane-head .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.pane-head .h{font-family:var(--mono);font-size:10.5px;color:var(--mut-3)}
.side-card{flex:1 1 260px;max-width:320px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.side-card .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut-4)}
.hr{height:1px;background:var(--line);margin:16px 0}

.finding{cursor:pointer;padding:13px 16px;border-bottom:1px solid var(--line-3);display:grid;
  grid-template-columns:62px minmax(180px,240px) minmax(0,1fr) 118px;gap:14px;align-items:center;transition:background .14s}
.finding:hover{background:var(--soft-2)}
.finding.on{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.tier-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:700;
  background:var(--soft-2);border:1px solid var(--soft-4);border-radius:5px;padding:4px 6px;justify-self:start}
.tier-badge .g{font-size:9px}
.finding .pkg{font-family:var(--mono);font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.finding .counts{font-family:var(--mono);font-size:10px;color:var(--mut-3);margin-top:5px}
.finding .sentence{font-size:12.5px;color:var(--fg-4);line-height:1.45;text-wrap:pretty}
.path{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.hop{font-family:var(--mono);font-size:10.5px;border-radius:5px;padding:3px 7px;white-space:nowrap;border:1px solid}
.hop-edge{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--mut-4);white-space:nowrap}
.open-btn{cursor:pointer;border:1px solid var(--soft-4);background:var(--soft-2);color:var(--accent);
  border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:10.5px;white-space:nowrap;transition:background .14s,border-color .14s}
.open-btn:hover{background:color-mix(in srgb, var(--accent) 16%, transparent);border-color:color-mix(in srgb, var(--accent) 50%, transparent)}
.tier-def{display:flex;gap:10px}
.tier-def .id{font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 46px}
.tier-def .help{font-size:12.5px;color:var(--fg-4);line-height:1.45;flex:1;text-wrap:pretty}
.edge-def .id{font-family:var(--mono);font-size:10.5px;color:var(--ident-2)}
.edge-def .help{font-size:12px;color:var(--mut-2);margin-top:3px;line-height:1.45}

/* ------------------------------------------------------------- advisories */
.adv-grid{display:grid;grid-template-columns:minmax(120px,190px) 110px minmax(0,1fr) 90px;gap:12px;
  padding:12px 16px;align-items:center;border-top:1px solid var(--line-3)}
.adv-head{display:grid;grid-template-columns:minmax(120px,190px) 110px minmax(0,1fr) 90px;gap:12px;padding:11px 16px;
  background:var(--soft-1);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mut-4)}
.adv-grid .id{font-family:var(--mono);font-size:12px;color:var(--fg);cursor:pointer}
.adv-grid .id:hover{color:var(--violet-fg)}
.adv-grid .sev{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px}
.adv-grid .vec{font-family:var(--mono);font-size:10.5px;color:var(--mut-3);overflow:hidden;text-overflow:ellipsis}
.adv-grid .fix{font-family:var(--mono);font-size:11px;color:var(--ok);text-align:right}
.pill{font-family:var(--mono);font-size:11px;color:var(--ok);background:color-mix(in srgb, var(--ok) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--ok) 24%, transparent);border-radius:6px;padding:4px 8px}

/* ------------------------------------------------------------- repository */
.repo-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.repo-input{flex:1 1 420px;min-width:0;display:flex;align-items:center;gap:9px;background:var(--panel-3);
  border:1px solid var(--soft-3);border-radius:8px;padding:10px 13px;transition:border-color .14s}
.repo-input:focus-within{border-color:color-mix(in srgb, var(--accent) 55%, transparent)}
.repo-input .pre{font-family:var(--mono);font-size:10.5px;color:var(--mut-4);white-space:nowrap}
.repo-input input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);
  font-family:var(--mono);font-size:12.5px}
.repo-input input::placeholder{color:var(--mut-5)}
.repo-submit{cursor:pointer;border:1px solid color-mix(in srgb, var(--accent) 50%, transparent);background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);
  border-radius:8px;padding:10px 18px;font-family:var(--mono);font-size:11.5px;white-space:nowrap;transition:background .14s}
.repo-submit:hover{background:color-mix(in srgb, var(--accent) 26%, transparent)}
.repo-submit[disabled]{opacity:.45;cursor:not-allowed}
.repo-msg{font-family:var(--mono);font-size:11px;margin-top:11px;display:flex;align-items:center;gap:8px}
.repo-msg.err{color:var(--critical)}
.repo-msg.ok{color:var(--ok)}
.repo-msg.wait{color:var(--mod)}
.spinner{width:11px;height:11px;border:1.5px solid color-mix(in srgb, var(--serious) 30%, transparent);border-top-color:var(--mod);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.repo-row{display:grid;grid-template-columns:minmax(180px,1fr) 150px 110px 96px;gap:14px;padding:13px 16px;
  border-top:1px solid var(--line-3);align-items:center}
.repo-row .nm{font-family:var(--mono);font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-row .sub{font-family:var(--mono);font-size:10px;color:var(--mut-3);margin-top:5px}
.repo-row .when{font-family:var(--mono);font-size:10.5px;color:var(--mut-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  border-radius:999px;padding:4px 9px;justify-self:start;white-space:nowrap}
.status .g{font-size:9px}
.ghost{cursor:pointer;border:1px solid var(--soft-4);background:var(--soft-2);color:var(--mut);
  border-radius:7px;padding:7px 10px;font-family:var(--mono);font-size:10.5px;transition:background .14s,color .14s}
.ghost:hover{background:var(--soft-3);color:var(--fg)}

/* ------------------------------------------------------------ proof chain */
.stage{display:grid;grid-template-columns:30px minmax(150px,210px) 128px minmax(0,1fr);gap:14px;padding:12px 16px;
  border-bottom:1px solid var(--line-3);align-items:center}
.stage .step{font-family:var(--mono);font-size:10.5px;color:var(--mut-5)}
.stage .title{font-size:13.5px;font-weight:500;color:var(--fg)}
.stage .blurb{font-size:12.5px;color:var(--ink-2);line-height:1.45;text-wrap:pretty}

/* --------------------------------------------------------------- inspector */
.meta-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
.meta-row .k{font-family:var(--mono);font-size:10.5px;color:var(--mut-3);flex:0 0 84px}
.meta-row .v{font-family:var(--mono);font-size:11px;color:var(--fg);text-align:right;flex:1;word-break:break-all}
.verdict-box{border:1px solid;border-radius:10px;padding:12px 13px;margin-top:14px}
.verdict-box .t{font-size:13px;font-weight:600}
.verdict-box .n{font-size:12.5px;color:var(--fg-4);margin-top:6px;line-height:1.5;text-wrap:pretty}
.clear-box{border:1px dashed color-mix(in srgb, var(--ok) 28%, transparent);background:color-mix(in srgb, var(--ok) 4%, transparent);border-radius:9px;padding:12px 13px}
.clear-box .t{font-family:var(--mono);font-size:11.5px;color:var(--ok)}
.clear-box .n{font-size:12.5px;color:var(--fg-4);margin-top:6px;line-height:1.5;text-wrap:pretty}

.empty{padding:44px 16px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--mut-4);line-height:1.9}
.banner{margin-top:14px;border:1px solid color-mix(in srgb, var(--critical) 30%, transparent);background:color-mix(in srgb, var(--critical) 6%, transparent);border-radius:12px;
  padding:14px 16px;font-family:var(--mono);font-size:11.5px;color:var(--critical);line-height:1.7}
/* ==================================================================
   Responsive

   This page is a sidebar plus a body of fixed-column grids, and the
   grids are where it actually breaks: a four-column findings row with a
   118px action button does not survive a phone by getting narrower, it
   survives by becoming four stacked rows.

   The sidebar carries two things -- the view switch and the trace
   targets -- and below 940 it becomes a panel opened from the app bar
   rather than a 160px column that can hold neither a package spec nor
   its "19 admit · 1 installed" line.
   ================================================================== */
@media (max-width: 1240px){
  #shell{grid-template-columns:206px minmax(0,1fr)}
  #body{padding:16px 16px 26px}
  main > header{padding:11px 16px;gap:12px}
  .finding{grid-template-columns:56px minmax(150px,200px) minmax(0,1fr) auto;gap:12px}
  .stage{grid-template-columns:26px minmax(130px,180px) 116px minmax(0,1fr);gap:12px}
}

/* The focus box is a label, not a control -- it repeats what the
   sidebar's selection already says -- so it is the first thing to go
   when the header runs out of room. */
@media (max-width: 1080px){
  .focus{min-width:0;flex:1 1 200px}
  .tiers{display:none}
  .adv-grid,.adv-head{grid-template-columns:minmax(110px,160px) 96px minmax(0,1fr) 78px;gap:10px}
  .repo-row{grid-template-columns:minmax(150px,1fr) 130px 96px 88px;gap:10px}
}

@media (max-width: 940px){
  #shell{grid-template-columns:minmax(0,1fr)}
  aside{width:min(300px,88vw);border-right:0}
  .focus{display:none}
  main > header{padding:10px 14px}
  #body{padding:14px 14px 24px}
}

/* Phone. Every fixed-column grid becomes a stack, in reading order:
   what tier, what entity, why, and then the action. */
@media (max-width: 720px){
  main > header{gap:10px;padding:10px 12px;align-items:flex-start}
  .view-title{font-size:14px}
  .act{padding:9px 12px;font-size:11px}
  #body{padding:12px 12px 22px}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:11px 12px}
  .kpi .v{font-size:21px}

  .story{flex-direction:column;gap:10px;padding:13px 14px}
  .story .sentence{font-size:13.5px}

  .finding{grid-template-columns:minmax(0,1fr);gap:9px;padding:13px 14px}
  .finding .counts{margin-top:3px}
  .open-btn{justify-self:start}
  .tier-badge{justify-self:start}

  .adv-grid,.adv-head{grid-template-columns:minmax(0,1fr);gap:6px}
  .adv-head{display:none}          /* column headings over one column say nothing */
  .adv-grid .fix{text-align:left}

  .repo-row{grid-template-columns:minmax(0,1fr);gap:9px}
  .stage{grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 14px}
  .stage .step{display:none}

  .split{gap:12px}
  .side-card{max-width:none;flex:1 1 100%;padding:14px}
  .meta-row{flex-direction:column;align-items:flex-start;gap:2px}
  .meta-row .v{text-align:left;flex:none}

  /* The propagation graph is absolutely positioned at computed pixel
     offsets -- six lanes of it do not reflow. It keeps its horizontal
     scroll, which is the honest answer for a wide diagram on a narrow
     screen. */
  .graph-scroll{padding:12px}
  .tip{width:min(280px,86vw)}
}

/* On a touch screen the propagation graph's hover tooltip can never
   fire, so the hint that tells you to hover is a lie. */
@media (hover: none){
  .card-head .h{display:none}
  .gnode:hover{transform:none}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="bar-spacer"></div>
  <div class="barstats">
    <div class="barstat alarm"><b id="barP0">—</b><span>runtime exposed</span></div>
    <div class="barstat"><b id="barFindings">—</b><span>findings</span></div>
    <div class="barstat opt-1"><b id="barMs">—</b><span>answered in ms</span></div>
  </div>
</header>

<div id="shell">
  <aside id="sidebar">
    <div class="side-head" style="padding-top:16px">this package</div>
    <nav id="nav"></nav>
    <div class="side-head">trace targets</div>
    <div id="targets"></div>
    <div class="side-foot" id="sideFoot">
      <div>connecting…</div>
      <div>&nbsp;</div>
    </div>
  </aside>

  <main>
    <header>
      <div style="min-width:190px">
        <div class="view-title" id="viewTitle">Overview</div>
        <div class="view-sub" id="viewSub">one narrative + the numbers behind it</div>
      </div>
      <div class="focus">
        <span class="k">focus</span>
        <span class="v" id="focusVal">—</span>
        <span class="spacer"></span>
        <span class="q">?target=</span>
      </div>
      <span class="spacer"></span>
      <div class="tiers" id="tierLegend"></div>
      <button class="act" id="markBtn"
        title="Writes a synthetic Incident node against this version in our own database. Nothing is downloaded, nothing is executed, and no package is modified.">simulate compromise</button>
    </header>
    <div id="body"></div>
  </main>
</div>

<script>
/* =====================================================================
   Blast Radius Console
   ---------------------------------------------------------------------
   Recreates the Claude Design handoff ("Blast Radius Console.dc.html")
   against the real API rather than the prototype's fixture data. The
   prototype's DCLogic/sc-for scaffolding is deliberately not reproduced --
   only its visual output is.

   Data sources, all live:
     /api/pkg/project   -> overview graph + fleet-wide stats
     /api/pkg/graph     -> one version's six-column propagation graph
     /api/pkg/targets   -> the sidebar's trace targets
     /api/graph?micro   -> call graph for the code-reach view
     /api/advisories    -> published advisories
     /api/pkg/incident  -> simulate / retract (POST / DELETE)
     /api/repos         -> repository intake (frontend only; see REPO INTAKE)
   ===================================================================== */

/* The tier ramp, read off the shared tokens rather than frozen as hexes,
   so it themes with everything else. These are the reserved STATUS
   colours -- outside the categorical set on every page, because a tier is
   a state and not a series. */
const HIGH='var(--critical)', MOD='var(--serious)', WARN='var(--warn)',
      SAFE='var(--ok)', VIOLET='var(--accent)';
const G={p0:'■',p1:'▲',p2:'◆',p3:'●'};

const TIERS={
  P0:{color:HIGH,glyph:G.p0,label:'runtime exposed',help:'Installed, confirmed by the lockfile, and reachable from application code.'},
  P1:{color:MOD ,glyph:G.p1,label:'reachable'     ,help:'Reachable through app code, but no confirmed exploit path to a user-facing entry point.'},
  P2:{color:WARN,glyph:G.p2,label:'build only'    ,help:'Present in build or tooling scope only; never shipped to users.'},
  P3:{color:SAFE,glyph:G.p3,label:'not reachable' ,help:'Installed somewhere in the tree, but no call path reaches it.'}
};

const TONES={
  hot  :{dot:HIGH,glyph:G.p0,bg:'color-mix(in srgb, var(--critical) 7%, transparent)' ,border:'color-mix(in srgb, var(--critical) 32%, transparent)'},
  path :{dot:MOD ,glyph:G.p1,bg:'color-mix(in srgb, var(--serious) 8%, transparent)',border:'color-mix(in srgb, var(--serious) 36%, transparent)'},
  build:{dot:WARN,glyph:G.p2,bg:'color-mix(in srgb, var(--warn) 6%, transparent)',border:'color-mix(in srgb, var(--warn) 26%, transparent)'},
  clean:{dot:SAFE,glyph:G.p3,bg:'color-mix(in srgb, var(--ok) 4%, transparent)',border:'var(--soft-3)'}
};
const EDGE_COLOR={hot:'color-mix(in srgb, var(--critical) 50%, transparent)',path:'color-mix(in srgb, var(--serious) 62%, transparent)',clean:'var(--soft-4)'};
const TIER_OF_TONE={hot:'P0',path:'P1',build:'P2',clean:'P3'};

const WHY={
  hot:'Red because an advisory or incident is filed directly against this node.',
  path:'Amber because a traced edge chain connects it to a compromised version.',
  build:'Yellow because a declared range admits it, but no lockfile confirms it.',
  clean:'Green because no traced edge chain reaches a compromised version.'
};
const WHY_EDGES={
  hot:['ADVISORY_FOR','AFFECTS'],
  path:['RESOLVES_VERSION','RESOLVED_IN'],
  build:['REQUIRES','SATISFIED_BY'],
  clean:['no exposing edge']
};

/* The server's node kinds, mapped onto the design's four tones. This is the
   one place the two vocabularies meet, so it stays explicit rather than
   being smeared through the renderer. */
const KIND_TONE={
  threat:'hot', advisory:'hot', compromised:'hot',
  subject:'path', resolution:'path', exposed:'path',
  possible:'build',
  related:'clean'
};

/* Confidence -> tier. The engine's four confidence levels already encode
   exactly the distinction the tiers draw, so this is a rename, not a
   judgement call layered on top. */
const TIER_OF_CONFIDENCE={
  CERTAIN:'P0', HIGH:'P0', MEDIUM:'P1', LOW:'P2', INVESTIGATE:'P3'
};

const EDGE_TYPES=[
  {id:'REQUIRES'        ,help:'A manifest names this package with a version range. A lead, not a finding.'},
  {id:'SATISFIED_BY'    ,help:'The range provably admits this exact version, frozen at ingest.'},
  {id:'RESOLVES_VERSION',help:'A lockfile actually selected this version. This is the confirmed claim.'},
  {id:'RESOLVED_IN'     ,help:'Flattened transitive closure: this version reaches that project, at a known depth.'},
  {id:'MAINTAINED_BY'   ,help:'Shared maintainer identity. Never a verdict on its own.'},
  {id:'TYPOSQUAT_OF'    ,help:'Name sits within edit distance of a far more popular package.'}
];

/* Two views, not six. The console had four more, and each was either
   answered better elsewhere or answered nothing:

     Overview      one narrative over the whole project. The Explorer's
                   header carries the same numbers against a denominator,
                   which is the version of them worth reading.
     Code reach    the call graph from entry points. The Explorer traces
                   the same edges from a *confirmed threat* instead of from
                   an entry point, which is the direction an incident is
                   actually worked in.
     Advisories    a flat list. The Explorer groups the same advisories by
                   version and says which reach code.
     Repositories  submit a repo for scanning -- /api/repos was never
                   implemented, so it degraded to localStorage and queued
                   nothing. The graph page takes a path and really scans it.

   What is left is what nothing else does:

     Supply chain  the six-column argument, and the only view that renders
                   `BlastRadiusEngine.analyse()` in full -- range-admits vs
                   lockfile-resolves, the live window, shared maintainers
                   and infrastructure, and typosquat neighbours. Four of the
                   six questions in the brief are answered only here.
     Assessment    the tiered findings and their evidence chain. The
                   confidence model -- why a finding is CONFIRMED rather
                   than INVESTIGATE -- appears nowhere else in the product. */
const NAV=[
  ['supply'    ,'Supply chain','◈'],
  ['findings'  ,'Assessment'  ,'▤']
];

const TITLES={
  supply    :['Supply chain','range admits vs lockfile resolves, live window, shared identity, typosquats'],
  findings  :['Assessment'  ,'tiered findings with their evidence chain']
};

/* ------------------------------------------------------------------ state */
const S={
  /* Lands on `supply` rather than `overview` for latency: the project view is
     several unpinned whole-graph sweeps plus a BFS (~2.6s cold), where a single
     package query is one hop over the precomputed closure (~76ms). */
  view:'supply',
  targets:[], target:null,          // target = "name@version" currently focused
  pkg:null, project:null, micro:null, advisories:[],
  findingIdx:0, hover:null, sel:null,
  loading:false, error:null,
  marked:new Set(),
  repos:[], repoMsg:null
};

const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok){
    let d='';
    try{ d=(await r.json()).detail||''; }catch(e){}
    throw new Error(d||(r.status+' '+r.statusText));
  }
  return r.json();
}

/* ------------------------------------------------------------------- boot */
async function boot(){
  renderNav();
  renderTierLegend();
  try{
    const [targets,health]=await Promise.all([
      api('/api/pkg/targets?limit=8').catch(()=>[]),
      api('/api/health').catch(()=>null)
    ]);
    S.targets=targets||[];
    if(S.targets.length) S.target=specOf(S.targets[0]);
    if(health&&health.empty){
      S.error='The graph is empty. Run:  python -m blastradius.cli pipeline corpus --reset';
    }
  }catch(e){ S.error=e.message; }

  const q=new URLSearchParams(location.search);
  if(q.get('target')) S.target=q.get('target');
  if(q.get('view')&&TITLES[q.get('view')]) S.view=q.get('view');

  /* loadRepos() used to run here and poll /api/repos, which was never
     implemented -- a guaranteed 404 in the console on every page load. The
     view it fed is gone; the graph page takes a path and really scans it. */
  renderTargets();
  await load();
}

function specOf(t){
  if(!t) return null;
  if(typeof t==='string') return t;
  if(t.spec) return t.spec;
  if(t.name&&t.version) return t.name+'@'+t.version;
  return t.key||t.label||null;
}

/* Fetch whatever the active view needs, then paint. Each payload is cached on
   S so switching tabs does not re-hit the node for data already in hand. */
async function load(){
  S.loading=true; render();
  try{
    /* One fetch serves both views: /api/pkg/graph runs engine.analyse(), and
       Assessment reads the findings off the same payload the Supply chain
       view draws. */
    if(S.target)
      S.pkg=await api('/api/pkg/graph?spec='+encodeURIComponent(S.target));
    S.error=null;
  }catch(e){ S.error=e.message; }
  S.loading=false; render();
}

function go(view){
  S.view=view; S.hover=null;
  try{ history.replaceState(null,'','?view='+view+(S.target?'&target='+encodeURIComponent(S.target):'')); }catch(e){}
  load();
}

function pickTarget(spec){
  S.target=spec; S.pkg=null; S.hover=null;
  if(S.view!=='supply'&&S.view!=='findings') S.view='supply';
  try{ history.replaceState(null,'','?view='+S.view+'&target='+encodeURIComponent(spec)); }catch(e){}
  renderTargets(); load();
}

/* ------------------------------------------------------------- chrome bits */
function renderNav(){
  $('#nav').innerHTML=NAV.map(([id,label,glyph])=>{
    const on=S.view===id;
    const n=navCount(id);
    return `<button class="nav-btn ${on?'on':''}" data-go="${id}">
      <span class="g">${glyph}</span><span class="lbl">${label}</span><span class="n">${n}</span></button>`;
  }).join('');
}

function navCount(id){
  if(id==='findings') return S.pkg&&S.pkg.findings?S.pkg.findings.length:'';
  if(id==='supply')   return S.pkg&&S.pkg.nodes?S.pkg.nodes.length:'';
  return '';
}

function renderTierLegend(){
  $('#tierLegend').innerHTML='<span class="k">tiers</span>'+Object.keys(TIERS).map(id=>{
    const t=TIERS[id];
    return `<span class="tier-chip" title="${esc(t.help)}">
      <span class="g" style="color:${t.color}">${t.glyph}</span>
      <span class="id" style="color:${t.color}">${id}</span>${esc(t.label)}</span>`;
  }).join('');
}

function renderTargets(){
  const el=$('#targets');
  if(!S.targets.length){ el.innerHTML='<div class="empty" style="padding:18px 6px">no targets yet</div>'; return; }
  el.innerHTML=S.targets.map(t=>{
    const spec=specOf(t);
    const on=spec===S.target;
    const tier=t.exposed_projects>0?'P0':(t.range_admits>0?'P2':'P3');
    const meta=(t.range_admits!=null?t.range_admits+' admit · ':'')+
               (t.projects!=null?t.projects+' installed':(t.exposed_projects||0)+' installed');
    return `<button class="tgt ${on?'on':''}" data-target="${esc(spec)}">
      <div class="row">
        <span class="gl" style="color:${TIERS[tier].color}">${TIERS[tier].glyph}</span>
        <span class="nm">${esc(spec)}</span>
      </div>
      <div class="mt">${esc(meta)}</div></button>`;
  }).join('');
}

function renderFoot(){
  const st=(S.pkg&&S.pkg.stats)||(S.project&&S.project.stats)||{};
  const ms=st.query_ms!=null?st.query_ms+' ms':'—';
  const ex=S.pkg?`${(S.pkg.exposure||{}).exposed||0} of ${(S.pkg.exposure||{}).total||0} in radius`
                :(S.project?`${(S.project.exposure||{}).exposed||0} of ${(S.project.exposure||{}).total||0} in radius`:'');
  $('#sideFoot').innerHTML=`<div>scan complete · ${esc(ms)}</div><div>${esc(ex)}</div>`;
}

/* ------------------------------------------------------------------ tones */
function toneOf(n){
  if(n.kind&&KIND_TONE[n.kind]) return KIND_TONE[n.kind];
  return n.vuln?'path':'clean';
}

/* The three numbers in the shared app bar. Deliberately the same shape as
   the other two pages' bars -- one alarming count, one scope count, one
   cost -- so a reader who has learnt to glance at the top right on one
   page has learnt it on all three. */
function renderBarStats(){
  const s=(S.pkg&&S.pkg.stats)||{};
  const findings=(S.pkg&&S.pkg.findings)||[];
  /* Graded exactly the way the findings list grades it. A finding has no
     `tier` field -- the tier is derived from `confidence`, and reading a
     property that does not exist made the bar say "0 runtime exposed"
     over a list with two P0 rows in it. Two numbers from one payload
     disagreeing about the same question is the failure this whole
     project is built to avoid, so there is one derivation. */
  const p0=findings.filter(f=>(TIER_OF_CONFIDENCE[f.confidence]||'P3')==='P0').length;
  setStat('barP0', S.pkg?p0:null);
  setStat('barFindings', S.pkg?findings.length:null);
  setStat('barMs', s.query_ms!=null?s.query_ms:null);
}

/* --------------------------------------------------------------- rendering */
function render(){
  renderNav(); renderTargets(); renderFoot(); renderBarStats();
  /* Falls back to `supply`, not to a removed view. `TITLES.overview` was the
     old default and no longer exists, so destructuring it would throw and
     blank the page rather than degrade. */
  const [t,sub]=TITLES[S.view]||TITLES.supply;
  $('#viewTitle').textContent=t;
  $('#viewSub').textContent=sub;
  $('#focusVal').textContent=S.target||'whole project';

  const mk=$('#markBtn');
  const isMarked=S.target&&S.marked.has(S.target);
  mk.textContent=isMarked?'retract simulation':'simulate compromise';
  mk.className='act'+(isMarked?' retract':'');
  mk.disabled=!S.target;

  const b=$('#body');
  if(S.error&&!S.loading){ b.innerHTML=story()+`<div class="banner">${esc(S.error)}</div>`; bind(); return; }
  if(S.loading){ b.innerHTML=story()+`<div class="card"><div class="empty"><span class="spinner"></span>  querying HydraDB…</div></div>`; bind(); return; }

  let html=story()+kpis();
  if(S.view==='supply')     html+=graphCard(S.pkg,'supply-chain propagation','hover a node to see why it is flagged')+stages();
  if(S.view==='findings')   html+=findings();
  b.innerHTML=html;
  bind();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
  document.querySelectorAll('[data-target]').forEach(e=>e.onclick=()=>pickTarget(e.dataset.target));
  document.querySelectorAll('[data-finding]').forEach(e=>e.onclick=()=>{
    S.findingIdx=+e.dataset.finding; S.hover=null; render();
  });
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=(ev)=>{
    ev.stopPropagation(); pickTarget(e.dataset.open);
  });
  document.querySelectorAll('.gnode').forEach(e=>{
    e.onmouseenter=()=>{
      S.hover={name:e.dataset.nm,meta:e.dataset.mt,tone:e.dataset.tone,
               x:Math.max(0,Math.min(+e.dataset.x,(+e.dataset.cw||1400)-300)),y:(+e.dataset.y)+62};
      paintTip();
    };
    e.onmouseleave=()=>{ S.hover=null; paintTip(); };
    e.onclick=()=>{ if(e.dataset.sel){ S.sel=e.dataset.sel; render(); } };
  });
  const rf=$('#repoForm'); if(rf) rf.onsubmit=submitRepo;
  document.querySelectorAll('[data-repo-rm]').forEach(e=>e.onclick=()=>removeRepo(e.dataset.repoRm));
}

/* ------------------------------------------------------------------ story */
function story(){
  const d=storyData();
  const t=TIERS[d.tier]||TIERS.P3;
  return `<div class="story ${d.tier==='P0'?'p0':''}">
    <span class="badge" style="color:${t.color}"><span class="g">${t.glyph}</span>${d.tier}</span>
    <div style="flex:1;min-width:0">
      <div class="sentence">${esc(d.sentence)}</div>
      <div class="sub">${esc(d.sub)}</div>
    </div></div>`;
}

function storyData(){
  if(S.loading) return {tier:'P3',sentence:'Querying the graph…',sub:'one hop over the precomputed closure'};
  const g=S.pkg;
  if(g&&g.verdict){
    const v=g.verdict;
    const tier=v.compromised?'P0':(v.level&&v.level!=='clean'?'P1':'P3');
    return {tier,sentence:[v.headline,v.reach].filter(Boolean).join(' — ')||'No known vulnerabilities.',
      sub:(g.target?'focus '+g.target+' · ':'')+((g.stats||{}).query_ms!=null?(g.stats.query_ms+' ms'):'')};
  }
  return {tier:'P3',sentence:'Pick a trace target to run a blast-radius query.',sub:'nothing marked yet'};
}

/* ------------------------------------------------------------------- kpis */
function kpis(){
  let items=[];
  if(S.pkg){
    const s=S.pkg.stats||{};
    /* These six are the brief's questions as numbers. `range_admits` beside
       `lockfile_entries` is the whole argument: the first is what a
       range-only scanner would page you about, the second is what a lockfile
       actually installed. `live_window` answers "while it was live". */
    items=[
      {label:'Advisories',value:s.advisories??0,unit:'filed',color:s.advisories?HIGH:SAFE},
      {label:'Range admits it',value:s.range_admits??0,unit:'range-only leads',color:s.range_admits?WARN:SAFE},
      {label:'Lockfile resolves it',value:s.lockfile_entries??0,unit:'confirmed',color:s.lockfile_entries?MOD:SAFE},
      {label:'Exposed projects',value:s.exposed_projects??0,unit:'transitively',color:s.exposed_projects?MOD:SAFE},
      {label:'Resolved while live',value:s.live_window_projects??0,unit:'in the window',color:s.live_window_projects?HIGH:SAFE},
      {label:'Related by identity',value:s.related??0,unit:'identity only',color:s.related?WARN:SAFE},
      {label:'Answered in',value:s.query_ms??'—',unit:'ms',color:'var(--ink-1)'}
    ];
  }
  if(!items.length) return '';
  return `<div class="kpis">`+items.map(k=>`<div class="kpi">
    <div class="lbl">${esc(k.label)}</div>
    <div class="val"><span class="v" style="color:${k.color}">${esc(k.value)}</span>
    <span class="u">${esc(k.unit)}</span></div></div>`).join('')+`</div>`;
}

/* ------------------------------------------------------------------ graph */
const LANE_W=244, LANE_GAP=32, ROW_H=62, TOP=68;

function graphCard(g,title,hint){
  if(!g||!g.nodes||!g.nodes.length){
    return `<div class="card"><div class="card-head"><span class="t">${esc(title)}</span></div>
      <div class="empty">no graph to draw yet<br>pick a trace target, or run an ingest</div></div>`;
  }
  const cols=g.cols||[];
  const byLayer={};
  g.nodes.forEach(n=>{ const l=n.layer??0; (byLayer[l]=byLayer[l]||[]).push(n); });
  const layers=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  const laneX={}; layers.forEach((l,i)=>laneX[l]=8+i*(LANE_W+LANE_GAP));
  const cw=8+layers.length*(LANE_W+LANE_GAP);
  const maxRows=Math.max(...layers.map(l=>byLayer[l].length),1);
  const ch=Math.max(240,TOP+maxRows*ROW_H+40);

  const pos={};
  layers.forEach(l=>byLayer[l].forEach((n,i)=>{ pos[n.id]={x:laneX[l],y:TOP+i*ROW_H}; }));

  /* lanes */
  const lanes=layers.map((l,i)=>{
    const c=byLayer[l].length;
    const anyHot=byLayer[l].some(n=>toneOf(n)==='hot');
    const anyPath=byLayer[l].some(n=>toneOf(n)==='path');
    const rule=anyHot?'color-mix(in srgb, var(--critical) 45%, transparent)':anyPath?'color-mix(in srgb, var(--serious) 45%, transparent)':'color-mix(in srgb, var(--ok) 35%, transparent)';
    return `<div class="lane" style="left:${laneX[l]}px;width:${LANE_W}px">
      <div class="r"><span class="step">0${i+1}</span>
      <span class="title">${esc(cols[l]||('layer '+l))}</span></div>
      <div class="count">${c} node${c===1?'':'s'}</div>
      <div class="rule" style="background:${rule}"></div></div>`;
  }).join('');

  /* edges */
  let ei=0;
  const paths=(g.edges||[]).map(e=>{
    const a=pos[e[0]],b=pos[e[1]];
    if(!a||!b) return '';
    const na=g.nodes.find(n=>n.id===e[0]), nb=g.nodes.find(n=>n.id===e[1]);
    const tone=(toneOf(na)==='hot'||toneOf(nb)==='hot')?'hot'
              :(toneOf(nb)==='path'||toneOf(na)==='path')?'path':'clean';
    const x1=a.x+LANE_W, y1=a.y+26, x2=b.x, y2=b.y+26;
    const c=Math.max(26,(x2-x1)*0.5);
    const i=ei++;
    const anim=tone==='clean'
      ? `brDraw 1s ease-out ${(0.12+i*0.02).toFixed(2)}s both`
      : `brDraw .9s ease-out ${(0.1+i*0.03).toFixed(2)}s both, brFlow 1.5s linear ${(1+i*0.03).toFixed(2)}s infinite`;
    return `<path d="M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}"
      fill="none" stroke="${EDGE_COLOR[tone]}" stroke-width="${tone==='clean'?1:1.6}"
      stroke-dasharray="${tone==='clean'?'2 6':'7 7'}" stroke-linecap="round" style="animation:${anim}"></path>`;
  }).join('');

  /* nodes */
  let ni=0;
  const nodes=g.nodes.map(n=>{
    const p=pos[n.id]; if(!p) return '';
    const tone=toneOf(n), T=TONES[tone];
    const i=ni++;
    const delay=(0.06+i*0.03).toFixed(2);
    let anim=`brRise .5s cubic-bezier(.2,.7,.3,1) ${delay}s both`;
    const pulse=tone==='hot'||n.kind==='compromised';
    if(pulse) anim+=`, brPulse 2.6s ease-out ${(+delay+0.7).toFixed(2)}s infinite`;
    const tag=n.kind==='compromised'?'COMPROMISED':n.kind==='exposed'?'EXPOSED'
             :n.kind==='resolution'?'CONFIRMED':n.kind==='possible'?'RANGE ONLY':null;
    const tagBg=n.kind==='compromised'?'var(--threat-1)':n.kind==='possible'?'var(--ident-1)':MOD;
    const tagFg=n.kind==='compromised'||n.kind==='possible'?'var(--ink-on)':'var(--surface-0)';
    return `<div class="gnode" style="left:${p.x}px;top:${p.y}px;width:${LANE_W}px;
      border-color:${T.border};background:${T.bg};animation:${anim}"
      data-nm="${esc(n.label)}" data-mt="${esc(n.sub||'')}" data-tone="${tone}"
      data-x="${p.x}" data-y="${p.y}" data-cw="${cw}"
      ${n.kind==='fn'||n.kind==='import'?`data-sel="${esc(n.label)}"`:''}>
      <div class="r1"><span class="gl" style="color:${T.dot}">${T.glyph}</span>
        <span class="nm">${esc(n.label)}</span></div>
      <div class="r2"><span class="mt">${esc(n.sub||'')}</span>
      ${tag?`<span class="tag" style="color:${tagFg};background:${tagBg}">${tag}</span>`:''}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-head">
      <span class="t">${esc(title)}</span><span class="h">${esc(hint)}</span>
      <span class="spacer"></span>
      <span class="edge-key"><i style="background:color-mix(in srgb, var(--critical) 60%, transparent)"></i>advisory edge</span>
      <span class="edge-key"><i style="background:color-mix(in srgb, var(--serious) 75%, transparent)"></i>confirmed path</span>
      <span class="edge-key"><i style="background:var(--soft-5)"></i>checked, clear</span>
    </div>
    <div class="graph-scroll"><div class="graph-plane" id="plane" style="width:${cw}px;height:${ch}px">
      <svg width="${cw}" height="${ch}">${paths}</svg>
      ${lanes}${nodes}
      <div id="tipHost"></div>
    </div></div></div>`;
}

/* =====================================================================
   REPO INTAKE  (frontend only)
   ---------------------------------------------------------------------
   Accepts a GitHub repository URL, validates it in the browser, and POSTs
   it to /api/repos. That endpoint does not exist yet — this is the frontend
   half only, per the brief. Until the backend lands, submissions persist to
   localStorage so the view is demonstrable end to end, and the UI says so
   plainly rather than pretending the queue is real.

   Backend contract this expects, when it is built:
     POST   /api/repos   {url, owner, name}  -> {id, url, owner, name, status, submitted_at}
     GET    /api/repos                       -> [ ...same shape ]
     DELETE /api/repos?id=<id>               -> {removed: true}
   ===================================================================== */
const REPO_KEY='br.repos.pending';

/* Accepts the forms people actually paste: full URL with or without scheme,
   with or without .git, plus bare owner/name. Rejects anything else rather
   than guessing, because a silently-wrong repo is worse than a rejected one. */
function parseRepo(raw){
  const s=(raw||'').trim().replace(/\s+/g,'');
  if(!s) return {error:'Paste a GitHub repository URL.'};
  let m=s.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/i);
  if(!m) m=s.match(/^git@github\.com:([\w.-]+)\/([\w.-]+?)(?:\.git)?$/i);
  if(!m) m=s.match(/^([\w.-]+)\/([\w.-]+?)(?:\.git)?$/);
  if(!m) return {error:'Not a GitHub repository. Try https://github.com/owner/name'};
  const [,owner,name]=m;
  if(owner==='.'||name==='.'||name==='..') return {error:'That owner/name pair is not valid.'};
  return {owner,name,url:`https://github.com/${owner}/${name}`};
}

function loadRepos(){
  try{ S.repos=JSON.parse(localStorage.getItem(REPO_KEY)||'[]'); }catch(e){ S.repos=[]; }
  /* If the backend is live it is the source of truth; local entries are a
     stand-in that gets replaced the moment the endpoint answers. */
  api('/api/repos').then(list=>{
    if(Array.isArray(list)){ S.repos=list; saveRepos(false); }
  }).catch(()=>{});
}
function saveRepos(repaint=true){
  try{ localStorage.setItem(REPO_KEY,JSON.stringify(S.repos)); }catch(e){}
  if(repaint) render();
}

async function submitRepo(ev){
  ev.preventDefault();
  const input=document.getElementById('repoUrl');
  const p=parseRepo(input.value);
  if(p.error){ S.repoMsg={kind:'err',text:p.error}; render(); return; }
  if(S.repos.some(r=>r.url.toLowerCase()===p.url.toLowerCase())){
    S.repoMsg={kind:'err',text:'That repository is already in the queue.'}; render(); return;
  }
  S.repoMsg={kind:'wait',text:'submitting '+p.owner+'/'+p.name+'…'}; render();

  const entry={
    id:'local-'+Date.now(), url:p.url, owner:p.owner, name:p.name,
    status:'queued', submitted_at:new Date().toISOString(), local:true
  };
  try{
    const saved=await api('/api/repos',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:p.url,owner:p.owner,name:p.name})
    });
    S.repos.unshift(Object.assign(entry,saved,{local:false}));
    S.repoMsg={kind:'ok',text:'queued '+p.owner+'/'+p.name+' for scanning'};
  }catch(e){
    /* No backend yet — say so rather than showing a fake success. */
    S.repos.unshift(entry);
    S.repoMsg={kind:'ok',text:'saved '+p.owner+'/'+p.name+' locally · backend endpoint /api/repos not live yet'};
  }
  saveRepos();
}

function removeRepo(id){
  S.repos=S.repos.filter(r=>r.id!==id);
  api('/api/repos?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
  S.repoMsg=null; saveRepos();
}

function repos(){
  const msg=S.repoMsg?`<div class="repo-msg ${S.repoMsg.kind}">
    ${S.repoMsg.kind==='wait'?'<span class="spinner"></span>':''}${esc(S.repoMsg.text)}</div>`:'';

  const rows=S.repos.length?S.repos.map(r=>{
    const st=r.status==='scanned'
      ? {fg:SAFE,bg:'color-mix(in srgb, var(--ok) 10%, transparent)',g:G.p3,t:'scanned'}
      : r.status==='failed'
      ? {fg:HIGH,bg:'color-mix(in srgb, var(--critical) 10%, transparent)',g:G.p0,t:'failed'}
      : {fg:MOD,bg:'color-mix(in srgb, var(--serious) 10%, transparent)',g:G.p1,t:'queued'};
    let when='—';
    try{ when=new Date(r.submitted_at).toLocaleString(); }catch(e){}
    return `<div class="repo-row">
      <div style="min-width:0">
        <div class="nm">${esc(r.owner)}/${esc(r.name)}</div>
        <div class="sub">${esc(r.url)}${r.local?' · not yet sent to backend':''}</div>
      </div>
      <span class="when">${esc(when)}</span>
      <span class="status" style="color:${st.fg};background:${st.bg}"><span class="g">${st.g}</span>${st.t}</span>
      <button class="ghost" data-repo-rm="${esc(r.id)}">remove</button>
    </div>`;
  }).join('')
  :`<div class="empty">no repositories submitted yet<br>paste a GitHub URL above to queue one</div>`;

  return `<div class="card">
    <div class="card-head"><span class="t">add a repository</span>
      <span class="h">public GitHub repos · lockfile resolution + OSV scan + ingest</span></div>
    <div style="padding:16px">
      <form id="repoForm" class="repo-form" autocomplete="off">
        <label class="repo-input">
          <span class="pre">github.com/</span>
          <input id="repoUrl" placeholder="owner/name  ·  or paste the full URL" spellcheck="false">
        </label>
        <button class="repo-submit" type="submit">queue scan</button>
      </form>
      ${msg}
      <div style="font-size:12.5px;color:var(--mut-2);line-height:1.55;margin-top:14px;text-wrap:pretty;max-width:70ch">
        The repository is read for its lockfiles only. Nothing is cloned, built, or executed from
        the browser, and no package code is run — the scan resolves declared ranges against what
        the lockfile actually pinned, then asks OSV about those exact versions.
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t">submitted</span>
      <span class="h">repo · submitted · status</span></div>
    ${rows}
  </div>`;
}

/* ------------------------------------------------------- simulate / retract */
$('#markBtn').onclick=async()=>{
  if(!S.target) return;
  const btn=$('#markBtn'); btn.disabled=true;
  const marked=S.marked.has(S.target);
  try{
    if(marked){
      await api('/api/pkg/incident?spec='+encodeURIComponent(S.target),{method:'DELETE'});
      S.marked.delete(S.target);
    }else{
      await api('/api/pkg/incident?spec='+encodeURIComponent(S.target),{method:'POST'});
      S.marked.add(S.target);
    }
    S.pkg=null; S.project=null;   // the graph changed; re-read it
    await load();
  }catch(e){ S.error=e.message; render(); }
};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ S.hover=null; paintTip(); }
});

/* Below 940 the sidebar becomes a panel: it holds the view switch and
   the trace targets, and neither survives a 160px column. */
setupRail({
  el:document.getElementById('sidebar'),
  side:'left', label:'Views and trace targets', glyph:'\u2630', media:940
});

/* Choosing a view or a target is the whole reason the panel was opened,
   and on a narrow screen it is now covering the answer. */
document.getElementById('sidebar').addEventListener('click',e=>{
  if(e.target.closest('.nav-btn')||e.target.closest('.tgt')) closeRails();
});

boot();
</script>
</body>
</html>
