<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<style>
/* ------------------------------------------------------------------
   The repo picker. No app bar here on purpose -- the tabs it would
   hold (Console / Explorer / Live graph) all answer questions about a
   repository that has not been chosen yet, so showing them first would
   point at destinations that are not ready. Everything else -- tokens,
   .card, .btn, .field, .note -- is base.css; this file is only layout.
   ------------------------------------------------------------------ */
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100%; padding: 32px 16px;
}
.wrap { width: 100%; max-width: 560px; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; text-align: center; }
.hero .brand { gap: 12px; }
.hero .brand .mark { width: 34px; height: 34px; border-radius: 10px; }
.hero .brand .mark::after { inset: 10px; }
.hero .brand .name { font-size: 24px; }
.hero p { margin: 0; color: var(--ink-3); font-size: 13px; max-width: 40ch; }

.sheet {
  background: var(--surface-0); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-2);
  padding: 22px 22px 20px;
}

.repolist { display: flex; flex-direction: column; gap: 8px; }
.repolist .card { padding: 13px 14px; }
.repolist .card .title { font-size: 13px; }
.repolist .card .meta b { color: var(--ink-2); font-weight: 500; }
.repolist:empty { display: none; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="brand"><span class="mark"></span><span class="name">Nodus</span></div>
    <p>Pick a repository to see its supply-chain exposure &mdash; what is vulnerable, what your code actually reaches, and what to patch first.</p>
  </div>

  <div class="sheet">
    <div class="panel-title">Choose a repository</div>
    <div id="repoList" class="repolist"></div>
    <div id="repoEmpty" class="note hidden"></div>
  </div>
</div>

<script>
"use strict";

const WORKSPACE_KEY = "nodus.workspace";
const repoList = document.getElementById("repoList");
const repoEmpty = document.getElementById("repoEmpty");

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function openWorkspace(ref) {
  try { localStorage.setItem(WORKSPACE_KEY, String(ref)); } catch (e) {}
  location.href = "/console";
}

function showNote(text, kind) {
  repoEmpty.textContent = text;
  repoEmpty.className = "note" + (kind ? " " + kind : "");
}

async function loadWorkspaces() {
  try {
    const res = await fetch("/api/chat/workspaces");
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const data = await res.json();
    // The auto-provisioned pooled workspace answers for every service in the
    // graph at once, which is the opposite of picking one repository -- it is
    // the fallback for anyone deep-linking past this page, never an option on it.
    const repos = (data.workspaces || []).filter((w) => w.slug !== "default");

    repoList.innerHTML = "";
    if (!repos.length) {
      showNote(
        "No repositories have been ingested yet. Run the seeding step on the "
        + "server (python -m blastradius.seed) to populate this list.",
        "warn"
      );
      return;
    }

    for (const w of repos) {
      const card = document.createElement("div");
      card.className = "card tappable";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.innerHTML = `
        <div class="title">${escapeHtml(w.label)}</div>
        <div class="meta"><b>${w.services}</b> service${w.services === 1 ? "" : "s"}</div>
      `;
      card.onclick = () => openWorkspace(w.id);
      card.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
      };
      repoList.append(card);
    }
  } catch (e) {
    repoList.innerHTML = "";
    showNote("Could not reach the server. Is it running?", "bad");
  }
}

loadWorkspaces();
</script>
</body>
</html>
