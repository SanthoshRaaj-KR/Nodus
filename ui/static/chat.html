<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius · Ask</title>

<!--
  One page, two states. With no id in the path it is the picker; with one it is
  that repository's chatbot. Kept as a single file so there is one page to keep
  correct rather than one per workspace, and deliberately dependency-free -- it
  is served straight from ui/static and needs no build step, so the assistant
  demos from a fresh checkout without anyone running `npm install` first.

  Tokens are copied from graph.html rather than imported: those pages are
  standalone too, and a shared stylesheet would make each of them fail to
  render alone.
-->

<style>
:root {
  color-scheme: light dark;
  --surface-0: #ffffff;
  --surface-1: #fcfcfb;
  --surface-2: #f3f3f1;
  --border:    #dcdcd6;
  --text-1:    #0b0b0b;
  --text-2:    #52514e;
  --text-3:    #85847e;
  --fleet:     #2a78d6;
  --deps:      #1baf7a;
  --ok:        #008300;
  --warn:      #eda100;
  --serious:   #eb6834;
  --critical:  #e34948;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
}
:root:where(:not([data-theme="light"])) {
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #232322;
  --border:    #33332f;
  --text-1:    #ffffff;
  --text-2:    #c3c2b7;
  --text-3:    #8d8c84;
  --fleet:     #3987e5;
  --deps:      #199e70;
  --warn:      #c98500;
  --serious:   #d95926;
  --critical:  #e66767;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-1);
  font: 15px/1.55 var(--sans);
  display: flex; flex-direction: column;
}

header {
  border-bottom: 1px solid var(--border); background: var(--surface-1);
  padding: 10px 18px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; flex: none;
}
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand span { color: var(--text-3); font-weight: 400; }
.who {
  font: 12px/1 var(--mono); color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 5px 9px; border-radius: 5px;
}
.spacer { flex: 1; }
header a, .linkish {
  color: var(--text-2); text-decoration: none; font-size: 13px;
  border: 1px solid var(--border); padding: 5px 10px; border-radius: 5px;
  background: none; cursor: pointer; font-family: var(--sans);
}
header a:hover, .linkish:hover { color: var(--text-1); background: var(--surface-2); }

main {
  flex: 1; overflow-y: auto; padding: 22px 18px 8px;
}
.wrap { max-width: 820px; margin: 0 auto; }

/* -- the briefing strip ------------------------------------------------- */
.brief {
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1);
  padding: 12px 14px; margin-bottom: 18px;
}
.brief h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
.stat b { font: 600 17px/1.2 var(--sans); display: block; }
.stat span { color: var(--text-3); font-size: 12px; }
.warnbar {
  margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px;
  background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  color: var(--text-1);
}

/* -- messages ----------------------------------------------------------- */
.msg { margin: 0 0 18px; }
.msg .role {
  font: 600 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 6px;
}
.msg.user .body {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px;
}
.body { white-space: pre-wrap; word-wrap: break-word; }
.body code {
  font: 13px var(--mono); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
}
.body strong { font-weight: 650; }
.body ul { margin: 8px 0; padding-left: 20px; }
.body li { margin: 3px 0; }

.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.tool {
  font: 11px/1 var(--mono); color: var(--text-2); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px;
}
.tool b { color: var(--fleet); font-weight: 600; }

.dots::after {
  content: '·'; animation: dots 1.2s steps(4, end) infinite;
  font-weight: 700; color: var(--text-3);
}
@keyframes dots {
  0% { content: '·'; } 25% { content: '··'; }
  50% { content: '···'; } 75% { content: '····'; }
}

/* -- suggestions -------------------------------------------------------- */
.suggest { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.suggest button {
  font: 13px var(--sans); color: var(--text-2); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 18px; padding: 6px 13px;
  cursor: pointer; text-align: left;
}
.suggest button:hover { color: var(--text-1); border-color: var(--text-3); }

/* -- composer ----------------------------------------------------------- */
footer {
  flex: none; border-top: 1px solid var(--border);
  background: var(--surface-1); padding: 12px 18px 16px;
}
.composer { max-width: 820px; margin: 0 auto; display: flex; gap: 9px; }
textarea {
  flex: 1; resize: none; font: 15px/1.45 var(--sans); padding: 10px 12px;
  color: var(--text-1); background: var(--surface-0);
  border: 1px solid var(--border); border-radius: 8px; min-height: 44px;
  max-height: 160px;
}
textarea:focus { outline: none; border-color: var(--fleet); }
button.send {
  font: 600 14px var(--sans); padding: 0 20px; border-radius: 8px; cursor: pointer;
  color: #fff; background: var(--fleet); border: 1px solid transparent;
}
button.send:disabled { opacity: .45; cursor: default; }
.hint { max-width: 820px; margin: 7px auto 0; font-size: 11.5px; color: var(--text-3); }

/* -- picker ------------------------------------------------------------- */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  border: 1px solid var(--border); border-radius: 9px; background: var(--surface-1);
  padding: 15px 16px; text-decoration: none; color: inherit; display: block;
}
.card:hover { border-color: var(--fleet); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .path { font: 11.5px var(--mono); color: var(--text-3); word-break: break-all; }
.card .meta { margin-top: 9px; font-size: 12.5px; color: var(--text-2); }
.empty {
  border: 1px dashed var(--border); border-radius: 9px; padding: 26px;
  text-align: center; color: var(--text-2);
}
.empty code {
  display: block; margin-top: 10px; font: 12.5px var(--mono);
  color: var(--text-1); background: var(--surface-2); padding: 9px;
  border-radius: 6px; text-align: left; white-space: pre-wrap;
}
.ungrounded {
  margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px;
  background: color-mix(in srgb, var(--critical) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--critical) 40%, transparent);
}
.ungrounded code { background: none; border: none; padding: 0; color: var(--critical); }
.err {
  border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent);
  background: color-mix(in srgb, var(--critical) 10%, transparent);
  border-radius: 7px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px;
}
h1 { font-size: 19px; margin: 0 0 4px; }
.sub { color: var(--text-2); font-size: 13.5px; margin: 0 0 20px; }
</style>

<header>
  <div class="brand">Blast Radius <span>· ask</span></div>
  <div class="who" id="who">…</div>
  <div class="spacer"></div>
  <button class="linkish" id="reset" hidden>clear chat</button>
  <a href="/chat">all chatbots</a>
  <a href="/">console</a>
</header>

<main><div class="wrap" id="wrap"></div></main>

<footer id="foot" hidden>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="Ask about this repository's dependencies…"></textarea>
    <button class="send" id="send">Ask</button>
  </div>
  <div class="hint" id="hint">Enter to send · Shift+Enter for a newline</div>
</footer>

<script>
/* Which chatbot this page is. `/chat` -> null (the picker), `/chat/2` -> "2".
 * Read from the path rather than a query string so the URL a user shares
 * names the repository it answers for. */
const REF = (location.pathname.match(/^\/chat\/([^/]+)/) || [])[1] || null;

/* One session id per browser, per chatbot. The server namespaces history by
 * workspace as well, so even a shared id cannot cross repositories -- this is
 * the belt to that server-side braces. */
const SESSION = (() => {
  const key = 'br.chat.session';
  let id = localStorage.getItem(key);
  if (!id) { id = Math.random().toString(36).slice(2, 12); localStorage.setItem(key, id); }
  return id;
})();

const wrap = document.getElementById('wrap');
const foot = document.getElementById('foot');
const who = document.getElementById('who');
const box = document.getElementById('q');
const send = document.getElementById('send');
const resetBtn = document.getElementById('reset');

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* Just enough markdown for what the agent actually emits: inline code, bold,
 * and dash lists. A full parser would be more code than the page and a bigger
 * surface for a rendering bug to become an injection. */
function render(text) {
  const lines = esc(text).split('\n');
  let html = '', list = false;
  for (const line of lines) {
    const item = line.match(/^\s*[-*]\s+(.*)$/);
    if (item) {
      if (!list) { html += '<ul>'; list = true; }
      html += `<li>${item[1]}</li>`;
      continue;
    }
    if (list) { html += '</ul>'; list = false; }
    html += line + '\n';
  }
  if (list) html += '</ul>';
  return html
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).detail || ''; } catch { /* not json */ }
    throw new Error(detail || `${r.status} ${r.statusText}`);
  }
  return r.json();
}

/* ---------------------------------------------------------------- picker */
async function showPicker() {
  who.textContent = 'pick a repository';
  document.title = 'Blast Radius · chatbots';
  let list = [];
  try {
    list = (await api('/api/chat/workspaces')).workspaces || [];
  } catch (e) {
    wrap.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }

  if (!list.length) {
    wrap.innerHTML = `
      <h1>No chatbots yet</h1>
      <p class="sub">Each ingested repository gets its own. They never share data.</p>
      <div class="empty">Ingest a repository, then register a chatbot for it:
        <code>python -m blastradius.cli ingest --corpus path/to/repo
python -m blastradius.chat.cli add path/to/repo --label "My repo"</code>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <h1>Chatbots</h1>
    <p class="sub">One per ingested repository. Each answers only for its own
      services -- they do not share findings.</p>
    <div class="cards">${list.map((w) => `
      <a class="card" href="/chat/${w.id}">
        <h3>#${w.id} · ${esc(w.label)}</h3>
        <div class="path">${esc(w.repo_path)}</div>
        <div class="meta">${w.services} service${w.services === 1 ? '' : 's'}${
          w.collisions && w.collisions.length
            ? ` · <span style="color:var(--warn)">${w.collisions.length} name clash</span>` : ''
        }</div>
      </a>`).join('')}</div>`;
}

/* ------------------------------------------------------------------ chat */
let briefEl, feedEl;

async function showChat() {
  wrap.innerHTML = `<div id="brief"></div><div id="suggest"></div><div id="feed"></div>`;
  briefEl = document.getElementById('brief');
  feedEl = document.getElementById('feed');
  foot.hidden = false;
  resetBtn.hidden = false;

  let health;
  try {
    health = await api(`/api/chat/${encodeURIComponent(REF)}/health`);
  } catch (e) {
    who.textContent = 'not found';
    wrap.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    foot.hidden = true;
    return;
  }

  const w = health.workspace;
  who.textContent = `#${w.id} · ${w.label}`;
  document.title = `Ask · ${w.label}`;

  let brief;
  try {
    brief = await api(`/api/chat/${encodeURIComponent(REF)}/briefing`);
  } catch (e) {
    briefEl.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }

  const t = brief.threat_count;
  const reach = brief.code_graph_ingested;
  briefEl.innerHTML = `
    <div class="brief">
      <h2>${esc(w.label)} · ${esc(w.repo_path)}</h2>
      <div class="stats">
        <div class="stat"><b>${w.services}</b><span>services</span></div>
        <div class="stat"><b style="color:${t ? 'var(--serious)' : 'var(--ok)'}">${t}</b><span>confirmed threats</span></div>
        <div class="stat"><b>${reach ? 'built' : 'not built'}</b><span>code graph</span></div>
      </div>
      ${reach ? '' : `<div class="warnbar">The code graph has not been built for this
        repository, so reachability is <strong>unknown</strong>, not clear. Findings
        are lockfile-level only until you run
        <code>python -m blastradius.cli ingest --corpus ${esc(w.repo_path)}</code>.</div>`}
      ${health.problems && health.problems.length
        ? `<div class="warnbar">${health.problems.map(esc).join('<br>')}</div>` : ''}
    </div>`;

  const sug = document.getElementById('suggest');
  sug.className = 'suggest';
  sug.innerHTML = (brief.suggestions || [])
    .map((s) => `<button>${esc(s)}</button>`).join('');
  sug.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { box.value = b.textContent; ask(); };
  });

  /* Pay the cold-cache cost now, while the reader is still looking at the
   * briefing, rather than after they hit send. */
  fetch(`/api/chat/${encodeURIComponent(REF)}/warm`, { method: 'POST' }).catch(() => {});
}

function bubble(role, html) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="role">${role === 'user' ? 'you' : 'blast radius'}</div>
                  <div class="tools" hidden></div><div class="body">${html || ''}</div>`;
  feedEl.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return el;
}

let busy = false;

async function ask() {
  const message = box.value.trim();
  if (!message || busy) return;
  busy = true; send.disabled = true; box.value = '';

  bubble('user', esc(message));
  const answer = bubble('bot', '<span class="dots"></span>');
  const toolBar = answer.querySelector('.tools');
  const body = answer.querySelector('.body');
  let text = '';

  try {
    const r = await fetch(`/api/chat/${encodeURIComponent(REF)}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: SESSION }),
    });
    if (!r.ok) {
      let detail = '';
      try { detail = (await r.json()).detail || ''; } catch { /* not json */ }
      throw new Error(detail || `${r.status} ${r.statusText}`);
    }

    /* fetch + reader rather than EventSource: EventSource is GET-only, and the
     * question belongs in a body rather than a URL somebody's proxy logs. */
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        const line = frame.split('\n').find((l) => l.startsWith('data: '));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }

        if (ev.type === 'token') {
          text += ev.text;
          body.innerHTML = render(text);
          answer.scrollIntoView({ behavior: 'smooth', block: 'end' });
        } else if (ev.type === 'tool') {
          toolBar.hidden = false;
          const arg = Object.values(ev.arguments || {})[0];
          const chip = document.createElement('span');
          chip.className = 'tool';
          chip.innerHTML = `<b>${esc(ev.name)}</b>${arg ? ' ' + esc(String(arg).slice(0, 40)) : ''}`;
          toolBar.appendChild(chip);
        } else if (ev.type === 'ungrounded') {
          /* The answer named a package this repository has never heard of.
           * Shown rather than silently scrubbed: editing the model's words
           * would hide the failure from the only person able to judge it. */
          const warn = document.createElement('div');
          warn.className = 'ungrounded';
          warn.innerHTML = 'Not in this repository&rsquo;s graph: '
            + ev.specs.map((x) => `<code>${esc(x)}</code>`).join(', ')
            + '. Treat those as unverified.';
          answer.appendChild(warn);
        } else if (ev.type === 'refused') {
          /* Off subject. The refusal text has already streamed as tokens; this
           * only labels it, so a decline does not read like a failed answer. */
          answer.querySelector('.role').textContent = 'blast radius · declined';
        } else if (ev.type === 'error') {
          text += `\n\n**Error:** ${ev.message}`;
          body.innerHTML = render(text);
        }
      }
    }
    if (!text.trim()) body.innerHTML = '<em style="color:var(--text-3)">No answer returned.</em>';
  } catch (e) {
    body.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    busy = false; send.disabled = false; box.focus();
  }
}

send.onclick = ask;
box.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
box.addEventListener('input', () => {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 160) + 'px';
});
resetBtn.onclick = async () => {
  await fetch(`/api/chat/${encodeURIComponent(REF)}/session/${SESSION}`, { method: 'DELETE' })
    .catch(() => {});
  feedEl.innerHTML = '';
  box.focus();
};

if (REF) showChat(); else showPicker();
</script>
